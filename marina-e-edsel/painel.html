<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel de Confirmações — Marina & Édsel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F7FAFE; --text:#2C3E50; --muted:#7B9AAF; --primary:#5BA4C9;
      --accent:#D4A574; --border:#D6E4ED; --ok:#27AE60; --no:#E07A5F;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Karla',sans-serif;color:var(--text);background:linear-gradient(160deg,#EaF3F9,#F7FAFE);min-height:100vh;padding:1.5rem}
    h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:.02em}
    .wrap{max-width:1000px;margin-inline:auto}
    .head{text-align:center;margin:1.5rem 0 2rem}
    .head p{color:var(--muted);font-size:.95rem;margin-top:.3rem}

    /* Login */
    .gate{max-width:380px;margin:3rem auto;background:#fff;border:1px solid var(--border);border-radius:16px;padding:2rem;box-shadow:0 8px 30px rgba(44,62,80,.08)}
    .gate label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem}
    .gate input{width:100%;font-size:1rem;padding:.8rem 1rem;border:1px solid var(--border);border-radius:10px;margin-bottom:1rem}
    .gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,165,116,.25)}
    .btn{width:100%;font-family:'Karla',sans-serif;font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:var(--primary);border:none;border-radius:100px;padding:.9rem;cursor:pointer;transition:background .25s}
    .btn:hover{background:#4890B5}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .err{color:var(--no);font-size:.88rem;margin-top:.2rem;min-height:1.2em}

    /* Dashboard */
    .panel{display:none}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.5rem}
    @media(min-width:680px){.cards{grid-template-columns:repeat(4,1fr)}}
    .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;box-shadow:0 4px 16px rgba(44,62,80,.05)}
    .card .num{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;line-height:1}
    .card .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:.4rem}
    .card.ok .num{color:var(--ok)} .card.no .num{color:var(--no)} .card.guests .num{color:var(--accent)} .card.total .num{color:var(--primary)}

    .bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem;flex-wrap:wrap}
    .bar h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.4rem}
    .bar button{font-size:.82rem;font-weight:600;color:var(--primary);background:#fff;border:1px solid var(--primary);border-radius:100px;padding:.45rem 1rem;cursor:pointer}
    .bar button:hover{background:var(--primary);color:#fff}

    .tablewrap{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(44,62,80,.05)}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th{text-align:left;background:#F0F6FB;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.8rem 1rem}
    td{padding:.8rem 1rem;border-top:1px solid var(--border)}
    tr:hover td{background:#FAFCFE}
    .tag{display:inline-block;font-size:.74rem;font-weight:700;padding:.2rem .6rem;border-radius:100px}
    .tag.ok{background:rgba(39,174,96,.12);color:var(--ok)}
    .tag.no{background:rgba(224,122,95,.14);color:var(--no)}
    .empty{text-align:center;color:var(--muted);padding:2.5rem 1rem;font-style:italic}
    .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:1.5rem}
    .num-cell{text-align:center;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Painel de Confirmações</h1>
      <p>Casamento Marina &amp; Édsel · 05 de Setembro de 2026</p>
    </div>

    <!-- Login -->
    <form class="gate" id="gate" autocomplete="off">
      <label for="pw">Senha de acesso</label>
      <input type="password" id="pw" placeholder="••••••••" required>
      <button class="btn" type="submit" id="enter">Entrar</button>
      <p class="err" id="err"></p>
    </form>

    <!-- Dashboard -->
    <div class="panel" id="panel">
      <div class="cards" id="cards"></div>
      <div class="bar">
        <h2>Lista de respostas</h2>
        <button id="refresh" type="button">Atualizar</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Nome</th><th>Resposta</th><th style="text-align:center">Pessoas</th><th>Data</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="foot">Atualizado em <span id="updated">—</span></p>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let pw = '';

    $('#gate').addEventListener('submit', async (e) => {
      e.preventDefault();
      pw = $('#pw').value;
      await load(true);
    });
    $('#refresh').addEventListener('click', () => load(false));

    async function load(fromGate) {
      const btn = $('#enter');
      $('#err').textContent = '';
      if (fromGate) { btn.disabled = true; btn.textContent = 'Entrando...'; }
      try {
        const res = await fetch('/.netlify/functions/rsvp-list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        if (res.status === 401) { $('#err').textContent = 'Senha incorreta.'; return; }
        const data = await res.json();
        if (!res.ok || !data.ok) { $('#err').textContent = 'Erro ao carregar. Tente novamente.'; return; }
        render(data);
        $('#gate').style.display = 'none';
        $('#panel').style.display = 'block';
      } catch (err) {
        $('#err').textContent = 'Falha de conexão. Tente novamente.';
      } finally {
        if (fromGate) { btn.disabled = false; btn.textContent = 'Entrar'; }
      }
    }

    function render(data) {
      const s = data.summary;
      $('#cards').innerHTML = `
        <div class="card ok"><div class="num">${s.confirmados}</div><div class="lbl">Confirmaram</div></div>
        <div class="card guests"><div class="num">${s.total_convidados}</div><div class="lbl">Total de convidados</div></div>
        <div class="card no"><div class="num">${s.nao_poderao}</div><div class="lbl">Não poderão ir</div></div>
        <div class="card total"><div class="num">${s.registros}</div><div class="lbl">Respostas no total</div></div>`;

      const tb = $('#tbody');
      if (!data.rows.length) {
        tb.innerHTML = `<tr><td colspan="4" class="empty">Nenhuma confirmação ainda.</td></tr>`;
      } else {
        tb.innerHTML = data.rows.map((r) => {
          const vai = /^sim/i.test((r.comparecimento || '').trim());
          const dt = new Date(r.created_at).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
          return `<tr>
            <td>${esc(r.nome)}</td>
            <td><span class="tag ${vai?'ok':'no'}">${vai?'Vai comparecer':'Não poderá'}</span></td>
            <td class="num-cell">${vai ? (r.pessoas ?? 1) : '—'}</td>
            <td>${dt}</td>
          </tr>`;
        }).join('');
      }
      $('#updated').textContent = new Date().toLocaleString('pt-BR');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
